# .streamlit/config.toml
# پیکربندی سرور و تم سامانه AradGPT Pro برای اجرا روی سرور لینوکس یا لوکال

[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
font = "sans serif"
