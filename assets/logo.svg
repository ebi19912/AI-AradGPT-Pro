<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Vibrant Neural Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Radiant Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

  <!-- Orbital Rings (Artificial Gravity) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#primaryGrad)" stroke-width="5" transform="rotate(-30 256 256)" opacity="0.75" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#primaryGrad)" stroke-width="3" transform="rotate(35 256 256)" opacity="0.6"/>

  <!-- Geometric Arad "A" Prism Core -->
  <path d="M 256 100 L 370 340 L 305 340 L 256 230 L 207 340 L 142 340 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Center Floating Neural Node -->
  <polygon points="256,190 286,250 256,310 226,250" fill="#ffffff" opacity="0.95"/>
  <circle cx="256" cy="250" r="14" fill="#6366f1" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="6" fill="#ffffff"/>

  <!-- Orbiting Satellite Sparks -->
  <circle cx="380" cy="190" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="130" cy="310" r="8" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="340" cy="370" r="6" fill="#c084fc"/>
  <circle cx="170" cy="160" r="5" fill="#818cf8"/>
</svg>
