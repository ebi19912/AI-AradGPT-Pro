# پیکربندی بهینه‌شده Nginx برای سامانه AradGPT Pro 2.5 (FastAPI Core)
# مسیر قرارگیری در سرور اوبونتو/دبیان: /etc/nginx/sites-available/aradgpt
# فعال‌سازی: sudo ln -s /etc/nginx/sites-available/aradgpt /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # حداکثر حجم فایل‌های ارسالی (برای اسناد بزرگ و فایل‌های صوتی)
    client_max_body_size 250M;

    # لاگ‌های اختصاصی
    access_log /var/log/nginx/aradgpt_access.log;
    error_log /var/log/nginx/aradgpt_error.log;

    # فشرده‌سازی Gzip برای بارگذاری سریع‌تر استایل‌ها و اسکریپت‌ها
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # تنظیمات هدرهای پروکسی
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تنظیمات حیاتی برای استریم زنده Server-Sent Events (SSE)
        # غیرفعال‌سازی بافرینگ برای دریافت لحظه‌ای و کلمه به کلمه توکن‌ها
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # زمان تایم‌اوت طولانی برای مدل‌های سنگین و استدلال عمیق
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # کش فایل‌های استاتیک محلی
    location /static/ {
        proxy_pass http://127.0.0.1:8501/static/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # کش آیکون و لوگوها
    location /assets/ {
        proxy_pass http://127.0.0.1:8501/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
